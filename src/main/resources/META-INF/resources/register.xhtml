<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>Inscription</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</h:head>
<h:body>
    <div class="container mt-5">
        <h2>Inscription</h2>
        <h:form>
            <div class="mb-3">
                <h:outputLabel for="username" value="Nom d'utilisateur" />
                <h:inputText id="username" value="#{registerController.username}" required="true" class="form-control"/>
            </div>
            <div class="mb-3">
                <h:outputLabel for="email" value="Email" />
                <h:inputText id="email" value="#{registerController.email}" required="true" class="form-control"/>
            </div>
            <div class="mb-3">
                <h:outputLabel for="password" value="Mot de passe" />
                <h:inputSecret id="password" value="#{registerController.password}" required="true" class="form-control"/>
            </div>
            <div class="mb-3">
                <h:outputLabel for="entreprise" value="Entreprise" />
                <h:inputText id="entreprise" value="#{registerController.entrepriseNom}" required="true" class="form-control"/>
            </div>
            <h:commandButton value="S'inscrire" action="#{registerController.register}" styleClass="btn btn-primary" />
            <h:link value="Déjà inscrit ? Connectez-vous" outcome="login.xhtml" class="btn btn-link"/>
        </h:form>
    </div>
</h:body>
</html>
