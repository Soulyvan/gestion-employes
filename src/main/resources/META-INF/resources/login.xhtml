<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>Connexion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</h:head>
<h:body>
    <div class="container mt-5">
        <h2>Connexion</h2>
        <h:form prependId="false">
            <div class="mb-3">
                <h:outputLabel for="username" value="Nom d'utilisateur" />
                <h:inputText id="username" name="username" class="form-control" required="true" />
            </div>
            <div class="mb-3">
                <h:outputLabel for="password" value="Mot de passe" />
                <h:inputSecret id="password" name="password" class="form-control" required="true" />
            </div>
            <button type="submit" class="btn btn-success">Se connecter</button>
            <h:link value="Créer un compte" outcome="register.xhtml" class="btn btn-link"/>
        </h:form>
    </div>
</h:body>
</html>
